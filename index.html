<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ดติดตามงาน — คณะวิศวกรรมศาสตร์ มมส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2A47;
    --ink-soft:#28496A;
    --slate:#5E7A93;
    --paper:#F2F7FC;
    --card:#FFFFFF;
    --line:#DCE7F0;
    --line-soft:#EAF3FA;
    --teal:#1E8065;
    --teal-bg:#E4F5EE;
    --amber:#B4832A;
    --amber-bg:#FBF1DE;
    --burgundy:#A13E52;
    --burgundy-bg:#F8E9ED;
    --navy-tag:#1D5C97;
    --dept-a:#1D5C97;
    --dept-b:#2E86C1;
    --dept-c:#63A9DB;
    --dept-d:#0E4B72;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,42,71,0.05), 0 6px 20px -8px rgba(15,42,71,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  ::selection{background:#CFE3F5;}
  a{color:inherit;}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--slate);
  }

  /* ---------- Header (normal flow — not sticky, so it scrolls away and frees room) ---------- */
  header.top{
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:1180px; margin:0 auto;
    padding:22px 24px 16px;
  }
  h1{
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:26px;
    margin:6px 0 4px;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:640px;
  }

  /* Sync button + connection status combined onto one row to save space */
  .sync-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-top:14px;
  }
  .conn-line{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--slate);
  }
  .conn-dot{width:7px; height:7px; border-radius:50%; background:#B7CBDD; flex-shrink:0;}
  .conn-dot.ok{background:var(--teal);}
  .conn-dot.err{background:var(--burgundy);}
  .conn-dot.loading{background:var(--amber); animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .sync-btn{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'Sarabun',sans-serif; font-size:13px; font-weight:600;
    padding:7px 13px; border-radius:9px;
    border:1px solid var(--ink); background:var(--ink); color:#fff;
    cursor:pointer; white-space:nowrap;
    transition:opacity .15s;
  }
  .sync-btn:hover{opacity:.88;}
  .sync-btn:disabled{opacity:.55; cursor:default;}
  .sync-btn svg{transition:transform .6s linear;}
  .sync-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .controls{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    margin-top:18px;
  }
  .search-wrap{
    position:relative; flex:1; min-width:220px; max-width:340px;
  }
  .search-wrap input{
    width:100%;
    font-family:'Sarabun',sans-serif;
    font-size:14px;
    padding:9px 12px 9px 32px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--dept-a);}
  .search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.45;}

  /* ---------- View tabs (งานติดตาม / งานที่แล้วเสร็จ) — normal flow ---------- */
  .view-tabs{
    display:flex; gap:6px; margin-top:18px;
    background:var(--line-soft); padding:4px; border-radius:12px; width:fit-content;
  }
  .view-tabs + .view-tabs{ margin-top:8px; }
  .view-btn{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:13.5px;
    padding:9px 18px; border-radius:9px; border:none; background:transparent;
    color:var(--ink-soft); cursor:pointer; transition:background .15s, color .15s;
    display:flex; align-items:center; gap:6px;
  }
  .view-btn:hover{color:var(--ink);}
  .view-btn.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .view-icon{font-size:14px;}

  /* ---------- Department pills — the ONLY sticky element, stays pinned while scrolling ---------- */
  .pill-bar{
    position:sticky; top:0; z-index:40;
    background:rgba(242,247,252,0.95);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 10px -6px rgba(15,42,71,0.15);
  }
  .pill-bar-inner{
    max-width:1180px; margin:0 auto; padding:12px 24px;
  }
  .pill-row{display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .pill-row::-webkit-scrollbar{display:none;}
  .pill{
    font-family:'Sarabun',sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    transition:background .15s, color .15s, border-color .15s;
  }
  .pill:hover{border-color:#B7CBDD;}
  .pill.active{
    background:var(--ink); color:#fff; border-color:var(--ink);
  }
  .pill .count{opacity:.65; font-family:'JetBrains Mono',monospace; font-size:11px; margin-left:5px;}

  /* ---------- Overview KPIs ---------- */
  .overview{
    max-width:1180px; margin:22px auto 0; padding:0 24px;
  }
  .kpi-row{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
  }
  .kpi{
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .kpi .num{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:30px; color:var(--ink);
    line-height:1;
  }
  .kpi .label{margin-top:8px; font-size:12.5px; color:var(--slate);}
  .kpi.accent-teal .num{color:var(--teal);}
  .kpi.accent-amber .num{color:var(--amber);}
  .kpi.accent-navy .num{color:var(--dept-a);}

  /* Status breakdown: stacked bar + legend, shows how many items sit at each of the 5 levels */
  .status-breakdown{
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); margin-top:12px;
  }
  .sb-title{font-size:12.5px; color:var(--slate); margin-bottom:10px;}
  .sb-bar{display:flex; width:100%; height:10px; border-radius:999px; overflow:hidden; background:var(--line-soft);}
  .sb-seg{height:100%;}
  .sb-legend{display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:12px;}
  .sb-legend.sb-outcome{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .sb-item.sb-urgent{color:var(--burgundy); font-weight:600;}
  .sb-item.sb-urgent b{color:var(--burgundy);}
  .sb-item{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);}
  .sb-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .sb-item b{font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--ink);}

  /* ---------- Main ---------- */
  main{max-width:1180px; margin:0 auto; padding:28px 24px 40px;}

  /* ---------- Impact footer (cumulative KPI: time / paper saved) ---------- */
  .impact-footer{
    border-top:1px solid var(--line);
    background:var(--line-soft);
    margin-top:20px;
  }
  .impact-inner{
    max-width:1180px; margin:0 auto; padding:26px 24px 40px;
  }
  .impact-title{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:14px;
    color:var(--ink-soft); margin-bottom:14px;
  }
  .impact-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
  }
  .impact-card{
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .impact-card .num{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:26px; color:var(--dept-a);
    line-height:1;
  }
  .impact-card .unit{font-size:13px; font-weight:500; color:var(--slate); margin-left:4px;}
  .impact-card .label{margin-top:6px; font-size:12.5px; color:var(--ink-soft); font-weight:500;}
  .impact-card .formula{margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--slate);}

  .dept-section{margin-top:36px;}
  .dept-head{
    display:flex; align-items:baseline; flex-wrap:wrap; gap:8px 10px; margin-bottom:14px;
    padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .dept-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-bottom:2px;}
  .dept-head h2{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:17px; margin:0;
    color:var(--ink);
    flex:1 1 240px; min-width:0; overflow-wrap:break-word;
  }
  .dept-head .dept-count{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--slate);
    flex-shrink:0;
  }

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;
  }

  .task-card{
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:16px 17px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px;
    border-left:3px solid var(--dept-color, var(--ink));
    min-width:0; overflow-wrap:break-word;
  }
  .task-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .task-no{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--slate);
  }
  .task-title{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:15px; color:var(--ink);
    margin:2px 0 0; line-height:1.35;
    overflow-wrap:break-word;
  }
  .status-tag{
    flex-shrink:0;
    font-family:'Sarabun',sans-serif; font-size:11.5px; font-weight:600;
    padding:4px 9px; border-radius:999px; white-space:nowrap;
  }
  .status-done{background:var(--teal-bg); color:var(--teal);}
  .status-near{background:var(--teal-bg); color:var(--teal);}
  .status-progress{background:var(--amber-bg); color:var(--amber);}
  .status-track{background:var(--amber-bg); color:var(--amber);}
  .status-none{background:#E7EEF5; color:var(--slate);}

  .tag-stack{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0;}
  .overdue-tag{
    font-family:'Sarabun',sans-serif; font-size:11px; font-weight:700;
    padding:4px 9px; border-radius:999px; white-space:nowrap;
    background:var(--burgundy-bg); color:var(--burgundy);
  }
  .task-card.overdue{
    border-color:var(--burgundy);
    box-shadow:0 1px 2px rgba(161,62,82,0.08), 0 6px 20px -8px rgba(161,62,82,0.18);
  }
  .card-dept-tag{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:.02em; margin-bottom:2px;
  }
  .card-dept-tag .dept-dot{width:7px; height:7px; border-radius:50%; margin-bottom:0;}

  .meta-line{
    font-size:12.5px; color:var(--slate); display:flex; flex-wrap:wrap; gap:4px 14px; overflow-wrap:break-word;
  }
  .meta-line span b{color:var(--ink-soft); font-weight:600;}

  .latest-block{
    background:var(--line-soft); border-radius:10px; padding:10px 12px;
  }
  .latest-block .latest-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--slate);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; display:block;
  }
  .latest-block .latest-text{font-size:13.5px; color:var(--ink-soft); white-space:pre-line; overflow-wrap:break-word;}
  .stale-flag{
    display:inline-block; margin-top:6px; font-size:11px; color:var(--burgundy);
    font-weight:600;
  }

  .timeline-dots{display:flex; gap:4px; align-items:center; flex-wrap:wrap;}
  .dot{
    width:9px; height:9px; border-radius:50%; background:#D3E2EF; cursor:default; position:relative;
  }
  .dot.filled{background:var(--dept-color, var(--ink));}
  .dot[data-tip]:hover::after{
    content:attr(data-tip);
    position:absolute; bottom:130%; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:11px; padding:6px 9px; border-radius:8px;
    white-space:pre-line; width:200px; line-height:1.4; z-index:20; box-shadow:var(--shadow);
    font-family:'Sarabun',sans-serif;
  }

  .expand-btn{
    align-self:flex-start;
    background:none; border:none; cursor:pointer;
    font-family:'Sarabun',sans-serif; font-size:12.5px; font-weight:600; color:var(--dept-color,var(--ink));
    padding:0; display:flex; align-items:center; gap:4px;
  }
  .expand-btn svg{transition:transform .15s;}
  .task-card.expanded .expand-btn svg{transform:rotate(180deg);}

  .full-timeline{display:none; flex-direction:column; gap:8px; margin-top:2px; border-top:1px dashed var(--line); padding-top:10px;}
  .task-card.expanded .full-timeline{display:flex;}
  .full-timeline .tl-entry{font-size:12.5px;}
  .full-timeline .tl-entry .tl-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--slate); display:block; margin-bottom:2px;
  }
  .full-timeline .tl-entry .tl-text{color:var(--ink-soft); white-space:pre-line; overflow-wrap:break-word;}
  .extra-fields{font-size:12px; color:var(--slate); border-top:1px dashed var(--line); padding-top:8px; margin-top:2px; display:none; flex-direction:column; gap:4px;}
  .task-card.expanded .extra-fields{display:flex;}
  .extra-fields b{color:var(--ink-soft);}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--slate); font-size:14px;
  }

  /* ---------- KPI / progress bars (per-department bar within card grid headers) ---------- */
  .progress-bar{
    width:100%; height:6px; border-radius:999px; background:var(--line-soft); overflow:hidden;
  }
  .progress-fill{height:100%; border-radius:999px; background:var(--dept-color, var(--ink)); transition:width .4s ease;}
  .dept-kpi-wrap{display:flex; align-items:center; gap:8px; margin-left:auto; flex-shrink:0;}
  .dept-kpi-num{
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:12.5px; color:var(--ink-soft);
    min-width:34px; text-align:right;
  }
  .dept-kpi-bar{width:90px;}

  @media (max-width:640px){
    h1{font-size:21px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="eyebrow">คณะวิศวกรรมศาสตร์ · มหาวิทยาลัยมหาสารคาม</div>
    <h1>แดชบอร์ดติดตามงานประชุมกำกับติดตามฯ</h1>
    <div class="subtitle">สรุปความคืบหน้างานสืบเนื่องจากการประชุมกำกับติดตามงานของคณบดี ปีงบประมาณ 2568–2569 แยกตามฝ่ายงานหลัก พร้อมสถานะล่าสุดของแต่ละเรื่อง</div>

    <div class="sync-row">
      <button class="sync-btn" id="syncBtn" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        ซิงก์ข้อมูลล่าสุด
      </button>
      <div class="conn-line" id="connLine"><span class="conn-dot"></span><span>ยังไม่เชื่อมต่อ</span></div>
    </div>

    <div class="view-tabs" id="yearTabs"></div>
    <div class="view-tabs" id="viewTabs"></div>

    <div class="controls">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="ค้นหาเรื่อง / ผู้รับผิดชอบ...">
      </div>
    </div>
  </div>
</header>

<section class="overview" id="overview"></section>

<div class="pill-bar">
  <div class="pill-bar-inner">
    <div class="pill-row" id="deptPills"></div>
  </div>
</div>

<main id="mainContent"></main>

<footer class="impact-footer">
  <div class="impact-inner">
    <div class="impact-title">ผลลัพธ์สะสมจากการติดตามงานผ่านระบบดิจิทัล</div>
    <div id="impactKpis" class="impact-grid"></div>

    completed: { key:'completed', label:'งานที่แล้วเสร็จ', icon:'✅', id:'1A9GP2bMue6FVqiWDIOXZVY0JUoV5hVPN', gid:552119194, defaultStatus:'สำเร็จ' }
  };
  const DEPT_COLORS = ['var(--dept-a)','var(--dept-b)','var(--dept-c)','var(--dept-d)'];

  // ---------- Thai fiscal year helpers ----------
  // Thai fiscal year (พ.ศ.) N runs 1 Oct (N-1, converted to CE) through 30 Sep (N, converted
  // to CE). E.g. FY2570 = 1 Oct 2026 (CE) – 30 Sep 2027 (CE). A Gregorian date's FY(BE) is
  // computed as: if month is Oct-Dec, FY = (year+1)+543; otherwise FY = year+543.
  function parseDateDDMMYYYY(str){
    if(!str) return null;
    const m = String(str).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!m) return null;
    const day = parseInt(m[1],10), month = parseInt(m[2],10), year = parseInt(m[3],10);
    if(month<1||month>12||day<1||day>31) return null;
    return {day, month, year};
  }
  function thaiFiscalYearOf(dateParts){
    if(!dateParts) return null;
    const feYear = (dateParts.month >= 10) ? (dateParts.year + 1) : dateParts.year;
    return String(feYear + 543);
  }
  function currentThaiFiscalYear(){
    const now = new Date();
    return thaiFiscalYearOf({day: now.getDate(), month: now.getMonth()+1, year: now.getFullYear()});
  }

  // ---------- Status mapping ----------
  // ใช้ค่าจากคอลัมน์ "สถานะ" ที่ผู้กรอกระบุเองในชีทโดยตรง (ไม่เดาจากคำในข้อความอีกต่อไป)
  // 5 ระดับ: ยังไม่มีรายงาน 0% / ติดตามงาน 25% / กำลังดำเนินการ 50% / ใกล้เสร็จสมบูรณ์ 75% / สำเร็จ 100%
  // สถานะ "ซ้ำ" = รายการซ้ำ ไม่นำมานับในสรุปหรือแสดงในแดชบอร์ด
  const STATUS_MAP = {
    'ยังไม่มีรายงาน':   {percent: 0,   label: 'ยังไม่มีรายงาน',   key:'none'},
    'ติดตามงาน':        {percent: 25,  label: 'ติดตามงาน',        key:'track'},
    'กำลังดำเนินการ':    {percent: 50,  label: 'กำลังดำเนินการ',    key:'progress'},
    'ใกล้เสร็จสมบูรณ์':  {percent: 75,  label: 'ใกล้เสร็จสมบูรณ์',  key:'near'},
    'สำเร็จ':           {percent: 100, label: 'สำเร็จ',           key:'done'}
  };
  const EXCLUDED_STATUS = 'ซ้ำ';

  function classify(item){
    const raw = (item.status || '').trim();
    if(STATUS_MAP[raw]) return STATUS_MAP[raw];
    return {percent: 0, label: raw ? `ไม่ทราบสถานะ (${raw})` : 'ยังไม่มีรายงาน', key: raw ? 'unknown' : 'none'};
  }

  function isStale(item, lastLabel){
    if(!item.latest) return false;
    return item.latest.label !== lastLabel;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Robust CSV parser (handles quoted fields, embedded newlines/commas) ----------
  // หมายเหตุ: ตัวแยกวิเคราะห์นี้ถือว่าเครื่องหมาย " เป็นตัวเริ่ม/ปิดฟิลด์ก็ต่อเมื่ออยู่ที่ตำแหน่ง
  // เริ่มต้นของฟิลด์เท่านั้น (มาตรฐาน RFC4180) — ถ้าพบ " กลางข้อความ (เช่น เครื่องหมายนิ้ว
  // หรือคำพูดที่พิมพ์ในข้อความประชุม) จะถือเป็นตัวอักษรธรรมดา ไม่ใช่ตัวเปิดฟิลด์ใหม่
  // ป้องกันปัญหาข้อมูลหลายแถวถูกกลืนรวมเป็นแถวเดียวเมื่อเจอเครื่องหมาย " ที่ไม่ได้ตั้งใจ
  function parseCSV(text){
    text = text.replace(/^\uFEFF/, ''); // strip UTF-8 BOM that Google's CSV export often prepends
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    for(let i=0; i<text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else{ inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if(c === '"' && field === ''){ inQuotes = true; } // only a true field-start quote toggles quote mode
        else if(c === ','){ row.push(field); field = ''; }
        else if(c === '\r'){ /* skip */ }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function normCell(s){
    return (s||'').replace(/\u00A0/g,' ').replace(/\uFEFF/g,'').trim();
  }

  // Extracts a comparable date out of a meeting-column label like "17 พ.ย.68",
  // "ผลประชุม 23 มีนาคม 2569", or "24 สิงหาคม 2569" — handles both abbreviated
  // ("พ.ย.") and full ("พฤศจิกายน") Thai month names, and both 2-digit and
  // 4-digit Buddhist-era years. Returns null if no date pattern is found.
  const THAI_MONTHS = {
    'มกราคม':1,'ม.ค.':1, 'กุมภาพันธ์':2,'ก.พ.':2, 'มีนาคม':3,'มี.ค.':3,
    'เมษายน':4,'เม.ย.':4, 'พฤษภาคม':5,'พ.ค.':5, 'มิถุนายน':6,'มิ.ย.':6,
    'กรกฎาคม':7,'ก.ค.':7, 'สิงหาคม':8,'ส.ค.':8, 'กันยายน':9,'ก.ย.':9,
    'ตุลาคม':10,'ต.ค.':10, 'พฤศจิกายน':11,'พ.ย.':11, 'ธันวาคม':12,'ธ.ค.':12
  };
  const THAI_MONTH_PATTERN = Object.keys(THAI_MONTHS)
    .sort((a,b)=>b.length-a.length)
    .map(m=>m.replace(/\./g,'\\.'))
    .join('|');
  const THAI_DATE_RE = new RegExp(`(\\d{1,2})\\s*(${THAI_MONTH_PATTERN})\\s*(\\d{2,4})`);

  function parseThaiDateLabel(label){
    const m = String(label||'').match(THAI_DATE_RE);
    if(!m) return null;
    const day = parseInt(m[1],10);
    const month = THAI_MONTHS[m[2]];
    let year = parseInt(m[3],10);
    if(year < 100) year += 2500; // 2-digit BE year (e.g. "68" -> 2568)
    if(!month || day<1 || day>31) return null;
    return {day, month, year, sortKey: year*10000 + month*100 + day};
  }

  // ---------- Build dashboard data from raw CSV rows, detecting columns by header text ----------
  function buildDataFromRows(rows, opts){
    opts = opts || {};
    // find header row: primarily key off 'เรื่อง' (title column), confirmed by a nearby
    // supporting column header — more robust than requiring 'ที่' as an exact standalone
    // cell, since merged/grouped columns can occasionally shift its exact text.
    let headerRowIdx = -1;
    const scanLimit = Math.min(rows.length, 30);
    const supportHeaders = ['การดำเนินการ','กำหนดเวลา','ผู้รับผิดชอบหลัก','หมายเหตุ','สถานะ'];
    for(let i=0; i<scanLimit; i++){
      const cells = rows[i].map(normCell);
      const hasTitle = cells.includes('เรื่อง');
      const hasSupport = cells.some(c => supportHeaders.includes(c));
      if(hasTitle && hasSupport){ headerRowIdx = i; break; }
    }
    if(headerRowIdx === -1){
      const preview = rows.slice(0, 4).map(r => r.slice(0,5).map(normCell).join(' | ')).join(' // ');
      console.error('[dashboard] header row not found. First rows preview:', preview);
      throw new Error('ไม่พบแถวหัวตาราง');
    }

    const header = rows[headerRowIdx].map(c => normCell(c).replace(/^"+|"+$/g,'').replace(/\s+/g,' '));
    let noCol=-1, titleCol=-1, actionCol=-1, deadlineCol=-1, respCol=-1, deptCol=-1, noteCol=-1, statusCol=-1, kpiCol=-1;
    let startDateCol=-1, doneDateCol=-1, durationDaysCol=-1, deadlineDaysCol=-1;
    const timelineCols = [];

    // Column detection uses keyword/contains matching (not exact-string matching) so
    // relabeling a header (e.g. adding "รับผิดชอบ" to "ฝ่ายงาน", or wrapping a header
    // across lines) doesn't break detection — only reordering or renaming beyond
    // recognition would. Checks are ordered so more specific keyword combos are tried
    // before looser ones that could otherwise false-match.
    header.forEach((h, idx) => {
      if(!h) return;
      if(h === 'ที่' && noCol === -1){ noCol = idx; return; }
      if(h === 'เรื่อง' && titleCol === -1){ titleCol = idx; return; }
      if(h === 'การดำเนินการ' && actionCol === -1){ actionCol = idx; return; }
      if(h.includes('วันที่เริ่ม') && startDateCol === -1){ startDateCol = idx; return; }
      if(h.includes('วันที่') && h.includes('สำเร็จ') && doneDateCol === -1){ doneDateCol = idx; return; }
      // "กำหนด...วัน" = allotted deadline days; "ระยะเวลา...วัน" (without กำหนด) = days elapsed so far
      if(h.includes('กำหนด') && h.includes('วัน') && deadlineDaysCol === -1){ deadlineDaysCol = idx; return; }
      if(h.includes('ระยะเวลา') && h.includes('วัน') && durationDaysCol === -1){ durationDaysCol = idx; return; }
      if(h === 'กำหนดเวลา' && deadlineCol === -1){ deadlineCol = idx; return; } // legacy free-text deadline column
      if(h.includes('ผู้รับผิดชอบ') && respCol === -1){ respCol = idx; return; }
      if(h.includes('ฝ่ายงาน') && deptCol === -1){ deptCol = idx; return; }
      if(h === 'หมายเหตุ' && noteCol === -1){ noteCol = idx; return; }
      if(h === 'สถานะ' && statusCol === -1){ statusCol = idx; return; }
      if(h.includes('ความคืบหน้า') && h.includes('KPI') && kpiCol === -1){ kpiCol = idx; return; }
      // everything else with header text -> treated as a timeline/meeting column
      timelineCols.push({index: idx, label: h});
    });

    // Sort meeting/timeline columns chronologically by the date parsed out of each
    // column's own label — not by column position — so a newly-added meeting column
    // is recognized as "latest" correctly even if inserted somewhere other than the
    // very last column. Columns whose label has no parseable date keep their original
    // relative order and sort after all dated ones.
    timelineCols.forEach(tc => { tc.parsed = parseThaiDateLabel(tc.label); });
    timelineCols.forEach((tc, i) => { tc._origIndex = i; });
    timelineCols.sort((a, b) => {
      const da = a.parsed ? a.parsed.sortKey : null;
      const db = b.parsed ? b.parsed.sortKey : null;
      if(da !== null && db !== null) return da - db;
      if(da !== null) return -1;
      if(db !== null) return 1;
      return a._origIndex - b._origIndex;
    });

    const departments = [];
    const deptIndexByName = {};
    let current = null;
    let itemId = 0;
    const width = header.length;

    for(let i = headerRowIdx + 1; i < rows.length; i++){
      const r = rows[i];
      const cells = [];
      for(let j=0; j<width; j++){ cells.push(normCell(r[j])); }

      const title = titleCol!==-1 ? cells[titleCol] : '';
      const no = noCol!==-1 ? cells[noCol] : '';

      // Preferred grouping: an explicit "ฝ่ายงาน" column filled in per item row —
      // authoritative and immune to merged-cell / hidden-column quirks that broke
      // the old row-detection heuristic. Falls back to that legacy heuristic only
      // when the sheet has no ฝ่ายงาน column at all.
      if(deptCol !== -1){
        if(!title) continue; // spacer / old-style section-label row with no item data -> skip
        const deptVal = cells[deptCol] || 'อื่นๆ';
        if(deptIndexByName[deptVal] === undefined){
          deptIndexByName[deptVal] = departments.length;
          departments.push({name: deptVal, items: []});
        }
        current = departments[deptIndexByName[deptVal]];
      } else {
        // Legacy fallback: detect a merged section-header row (title empty, a cell
        // reading like "งาน...ฝ่าย...") to open a new department bucket.
        let deptName = '';
        if(!title){
          if(no && no.includes('ฝ่าย') && no.startsWith('งาน')){
            deptName = no;
          } else {
            const found = cells.find(c => c.includes('ฝ่าย') && c.startsWith('งาน'));
            if(found) deptName = found;
          }
        }
        if(deptName){
          current = {name: deptName, items: []};
          departments.push(current);
          continue;
        }
        if(!title && !no) continue;
        if(!title) continue;
        if(!current){ current = {name:'อื่นๆ', items:[]}; departments.push(current); }
      }

      const statusRaw = statusCol!==-1 ? cells[statusCol] : (opts.defaultStatus || '');
      if(statusRaw.trim() === EXCLUDED_STATUS) continue; // รายการซ้ำ -> ไม่นับ ไม่แสดง

      if(!current){ current = {name:'อื่นๆ', items:[]}; departments.push(current); }

      const timeline = timelineCols
        .map(tc => ({label: tc.label, text: cells[tc.index]}))
        .filter(t => t.text);

      // Overdue calculation: ระยะเวลา (วัน) [days elapsed] vs กำหนดเวลา (วัน) [days allotted].
      // Positive overdueDays means the item has run longer than its allotted timeframe.
      const parseNum = (v) => { const n = parseFloat((v||'').replace(/,/g,'')); return isNaN(n) ? null : n; };
      const durationDays = durationDaysCol!==-1 ? parseNum(cells[durationDaysCol]) : null;
      const deadlineDays = deadlineDaysCol!==-1 ? parseNum(cells[deadlineDaysCol]) : null;
      const overdueDays = (durationDays!==null && deadlineDays!==null) ? (durationDays - deadlineDays) : null;

      const startDateRaw = startDateCol!==-1 ? cells[startDateCol] : '';
      const fiscalYear = thaiFiscalYearOf(parseDateDDMMYYYY(startDateRaw));

      itemId++;
      current.items.push({
        id: itemId,
        no: no,
        title: title,
        action: actionCol!==-1 ? cells[actionCol] : '',
        deadline: deadlineCol!==-1 ? cells[deadlineCol] : '',
        startDate: startDateRaw,
        doneDate: doneDateCol!==-1 ? cells[doneDateCol] : '',
        durationDays: durationDays,
        deadlineDays: deadlineDays,
        overdueDays: overdueDays,
        fiscalYear: fiscalYear,
        responsible: respCol!==-1 ? cells[respCol] : '',
        note: noteCol!==-1 ? cells[noteCol] : '',
        status: statusRaw,
        kpi: kpiCol!==-1 ? cells[kpiCol] : '',
        timeline: timeline,
        latest: timeline.length ? timeline[timeline.length-1] : null
      });
    }

    const timelineLabels = timelineCols.map(tc=>tc.label);
    return {timeline_labels: timelineLabels, departments: departments.filter(d=>d.items.length)};
  }

  // ---------- State ----------
  let DATASETS = {
    tracking: JSON.parse(document.getElementById('dashboard-data').textContent),
    completed: null
  };
  let currentView = 'tracking';
  let DATA = DATASETS[currentView] || {timeline_labels:[], departments:[]};
  let activeYear = currentThaiFiscalYear(); // client-side date filter, not a separate data source
  let activeDept = 'all';
  let searchTerm = '';
  let lastSyncedAt = null;

  let syncAttempted = false;

  function setActiveData(){
    DATA = DATASETS[currentView] || {timeline_labels:[], departments:[]};
  }

  // Years present in the currently loaded data, always including today's real FY so
  // that tab exists even before any item is dated into it. Items with no parseable
  // start date are NOT counted here (they're shown regardless of which year is active).
  function availableYears(){
    const years = new Set([currentThaiFiscalYear()]);
    DATA.departments.forEach(d => d.items.forEach(it => { if(it.fiscalYear) years.add(it.fiscalYear); }));
    return [...years].sort();
  }

  // Departments filtered down to the active fiscal year. An item with no parseable
  // "วันที่เริ่ม" stays visible in every year (so missing data entry never hides work).
  function visibleDepartments(){
    return DATA.departments
      .map(d => ({...d, items: d.items.filter(it => !it.fiscalYear || it.fiscalYear === activeYear)}))
      .filter(d => d.items.length);
  }

  // ---------- KPI helpers ----------
  function deptKPI(dept){
    if(!dept.items.length) return 0;
    const sum = dept.items.reduce((a,it)=>a + classify(it).percent, 0);
    return Math.round(sum / dept.items.length);
  }
  function overallKPI(depts){
    const all = depts.flatMap(d=>d.items);
    if(!all.length) return 0;
    const sum = all.reduce((a,it)=>a + classify(it).percent, 0);
    return Math.round(sum / all.length);
  }

  function shortName(name){
    return name.trim().replace(/^งาน\s*/, '').replace(/\s+/g,' ');
  }

  function resetFilters(){
    searchTerm = '';
    const si = document.getElementById('searchInput');
    if(si) si.value = '';
    activeDept = 'all';
  }

  // ---------- Year switch (ปีงบประมาณ — client-side filter by วันที่เริ่ม) ----------
  function renderYearSwitch(){
    const wrap = document.getElementById('yearTabs');
    if(!wrap) return;
    const years = availableYears();
    if(!years.includes(activeYear)) activeYear = years[years.length-1];
    wrap.innerHTML = years.map(y => `
      <button class="view-btn ${activeYear===y?'active':''}" data-year="${y}">
        <span class="view-icon">📅</span> ปีงบประมาณ ${y}
      </button>
    `).join('');
    wrap.querySelectorAll('.view-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(activeYear === btn.dataset.year) return;
        activeYear = btn.dataset.year;
        activeDept = 'all';
        renderAll();
      });
    });
  }

  // ---------- View switch (งานติดตาม / งานที่แล้วเสร็จ) ----------
  function renderViewSwitch(){
    const wrap = document.getElementById('viewTabs');
    if(!wrap) return;
    wrap.innerHTML = Object.values(VIEWS).map(v => `
      <button class="view-btn ${currentView===v.key?'active':''}" data-view="${v.key}">
        <span class="view-icon">${v.icon}</span> ${escapeHtml(v.label)}
      </button>
    `).join('');
    wrap.querySelectorAll('.view-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(currentView === btn.dataset.view) return;
        currentView = btn.dataset.view;
        resetFilters();
        setActiveData();
        renderViewSwitch();
        renderAll();
      });
    });
  }

  // ---------- Rendering ----------
  function renderHeader(){
    // Diagnostic info intentionally not shown to viewers — logged to console only.
    const lastLabel = DATA.timeline_labels[DATA.timeline_labels.length - 1] || '-';
    console.log(`[dashboard] build ${BUILD_ID} · view ${currentView} · year ${activeYear} · data round ${lastLabel} · ${DATA.timeline_labels.length} rounds` + (lastSyncedAt ? ` · synced ${lastSyncedAt}` : ''));
  }

  const STATUS_ORDER = ['none','track','progress','near','done'];
  const STATUS_COLORS = {
    none:'#9AAAB8', track:'#D9A441', progress:'#C97F2A', near:'#5FAE8C', done:'#1E8065'
  };

  function renderStatusBreakdown(depts){
    const all = depts.flatMap(d=>d.items);
    const counts = {none:0, track:0, progress:0, near:0, done:0, unknown:0};
    all.forEach(it => {
      const c = classify(it);
      if(counts[c.key] !== undefined) counts[c.key]++;
      else counts.unknown++;
    });
    const total = all.length || 1;
    const remaining = total - counts.done - counts.unknown;

    const segments = STATUS_ORDER.map(key => {
      const n = counts[key];
      if(!n) return '';
      const pct = (n/total*100).toFixed(2);
      return `<span class="sb-seg" style="width:${pct}%; background:${STATUS_COLORS[key]}"></span>`;
    }).join('');

    const legend = STATUS_ORDER.map(key => {
      const n = counts[key];
      const label = Object.values(STATUS_MAP).find(s=>s.key===key)?.label || key;
      return `<div class="sb-item"><span class="sb-dot" style="background:${STATUS_COLORS[key]}"></span>${escapeHtml(label)}: <b>${n}</b></div>`;
    }).join('');

    // Outcome summary: on-time vs late completions, plus in-progress (and, within
    // in-progress, how many are already overdue) — a different cut than the 5-level
    // status breakdown above. Kept as one slim extra row in the same card, not a
    // separate section, since this is a summary aside — not the main focus of the page.
    const doneItems = all.filter(it => classify(it).key === 'done');
    const doneOnTime = doneItems.filter(it => it.overdueDays === null || it.overdueDays <= 0).length;
    const doneLate = doneItems.filter(it => it.overdueDays !== null && it.overdueDays > 0).length;
    const inProgressItems = all.filter(it => classify(it).key !== 'done');
    const inProgress = inProgressItems.length;
    const inProgressOverdue = inProgressItems.filter(it => it.overdueDays !== null && it.overdueDays > 0).length;
    const inProgressOnTime = inProgress - inProgressOverdue;
    const outcomeRow = `
      <div class="sb-item"><span class="sb-dot" style="background:${STATUS_COLORS.done}"></span>สำเร็จตามกำหนด: <b>${doneOnTime}</b></div>
      <div class="sb-item"><span class="sb-dot" style="background:var(--burgundy)"></span>สำเร็จเกินกำหนด: <b>${doneLate}</b></div>
      <div class="sb-item"><span class="sb-dot" style="background:${STATUS_COLORS.progress}"></span>กำลังดำเนินการ: <b>${inProgress}</b></div>
      <div class="sb-item"><span class="sb-dot" style="background:${STATUS_COLORS.near}"></span>ดำเนินการอยู่ในช่วงเวลา: <b>${inProgressOnTime}</b></div>
      <div class="sb-item sb-urgent"><span class="sb-dot" style="background:var(--burgundy)"></span>กำลังดำเนินการเกินกำหนด: <b>${inProgressOverdue}</b></div>
    `;

    return `
      <div class="status-breakdown">
        <div class="sb-title">สรุปสถานะรายเรื่อง — เหลืองาน<b style="color:var(--ink)">${remaining}</b>เรื่องที่ต้องกำกับติดตามต่อ จากทั้งหมด ${total} เรื่อง (สำเร็จแล้ว ${counts.done} เรื่อง)</div>
        <div class="sb-bar">${segments}</div>
        <div class="sb-legend">${legend}</div>
        <div class="sb-legend sb-outcome">${outcomeRow}</div>
      </div>
    `;
  }

  function renderOverview(){
    const depts = visibleDepartments();
    const totalItems = depts.reduce((a,d)=>a+d.items.length,0);
    const kpi = overallKPI(depts);

    document.getElementById('overview').innerHTML = `
      <div class="kpi-row">
        <div class="kpi">
          <div class="num">${totalItems}</div>
          <div class="label">เรื่องทั้งหมดในมุมมองนี้</div>
        </div>
        <div class="kpi accent-navy">
          <div class="num">${kpi}%</div>
          <div class="label">ความคืบหน้าเฉลี่ยรวม (ประมาณการจากสถานะ)</div>
        </div>
      </div>
      ${renderStatusBreakdown(depts)}
    `;
  }

  function renderPills(){
    const depts = visibleDepartments();
    const totalItems = depts.reduce((a,d)=>a+d.items.length,0);
    const pillRow = document.getElementById('deptPills');
    let html = `<button class="pill ${activeDept==='all'?'active':''}" data-dept="all">ทั้งหมด <span class="count">${totalItems}</span></button>`;
    depts.forEach((d,i) => {
      html += `<button class="pill ${activeDept===String(i)?'active':''}" data-dept="${i}">${escapeHtml(shortName(d.name))} <span class="count">${d.items.length}</span></button>`;
    });
    pillRow.innerHTML = html;
    pillRow.querySelectorAll('.pill').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeDept = btn.dataset.dept; renderMain(); renderPills(); });
    });
  }

  function renderTimelineDots(item, color){
    return DATA.timeline_labels.map(lbl=>{
      const entry = item.timeline.find(t=>t.label===lbl);
      const cls = entry ? 'dot filled' : 'dot';
      const tip = entry ? `${lbl}\n${entry.text}` : lbl;
      return `<span class="${cls}" style="--dept-color:${color}" data-tip="${escapeHtml(tip)}"></span>`;
    }).join('');
  }

  function renderCard(item, color, lastLabel, opts){
    opts = opts || {};
    const status = classify(item);
    const stale = isStale(item, lastLabel);
    const statusClassMap = {
      done: 'status-done', near: 'status-near', progress: 'status-progress',
      track: 'status-track', none: 'status-none', unknown: 'status-none'
    };
    const statusClass = statusClassMap[status.key] || 'status-none';
    const isOverdue = item.overdueDays !== null && item.overdueDays > 0 && status.key !== 'done';

    const metaBits = [];
    if(item.responsible) metaBits.push(`<span><b>ผู้รับผิดชอบ</b> ${escapeHtml(item.responsible)}</span>`);
    if(item.deadlineDays !== null) metaBits.push(`<span><b>กำหนดเวลา</b> ${item.deadlineDays} วัน</span>`);
    if(item.durationDays !== null) metaBits.push(`<span><b>ผ่านมาแล้ว</b> ${item.durationDays} วัน</span>`);
    if(!item.deadlineDays && item.deadline) metaBits.push(`<span><b>กำหนดเวลา</b> ${escapeHtml(item.deadline)}</span>`);

    const latestHtml = item.latest
      ? `<div class="latest-block"><span class="latest-label">${escapeHtml(item.latest.label)}</span><div class="latest-text">${escapeHtml(item.latest.text)}</div>${stale ? `<div class="stale-flag">● ยังไม่อัปเดตในการประชุมล่าสุด</div>` : ''}</div>`
      : `<div class="latest-block"><span class="latest-label">สถานะ</span><div class="latest-text">ยังไม่มีการรายงานความคืบหน้าในรอบการประชุมใดๆ</div></div>`;

    const fullTimeline = item.timeline.length
      ? item.timeline.map(t=>`<div class="tl-entry"><span class="tl-label">${escapeHtml(t.label)}</span><span class="tl-text">${escapeHtml(t.text)}</span></div>`).join('')
      : '';

    const extraFields = [];
    if(item.action) extraFields.push(`<div><b>การดำเนินการ:</b> ${escapeHtml(item.action)}</div>`);
    if(item.note) extraFields.push(`<div><b>หมายเหตุ:</b> ${escapeHtml(item.note)}</div>`);
    if(item.kpi) extraFields.push(`<div><b>ความคืบหน้า KPI (ตามที่ระบุในชีท):</b> ${escapeHtml(item.kpi)}</div>`);
    if(item.startDate) extraFields.push(`<div><b>วันที่เริ่ม:</b> ${escapeHtml(item.startDate)}</div>`);
    if(item.doneDate) extraFields.push(`<div><b>วันที่งานสำเร็จ:</b> ${escapeHtml(item.doneDate)}</div>`);

    return `
    <div class="task-card ${isOverdue ? 'overdue' : ''}" style="--dept-color:${color}">
      ${opts.showDeptTag ? `<div class="card-dept-tag" style="color:${color}"><span class="dept-dot" style="background:${color}"></span>${escapeHtml(shortName(opts.deptName || ''))}</div>` : ''}
      <div class="task-top">
        <div>
          <div class="task-no">${item.no ? '#'+escapeHtml(item.no) : ''}</div>
          <div class="task-title">${escapeHtml(item.title)}</div>
        </div>
        <div class="tag-stack">
          <div class="status-tag ${statusClass}">${status.label} · ${status.percent}%</div>
          ${isOverdue ? `<div class="overdue-tag">⚠ เกินกำหนด ${item.overdueDays} วัน</div>` : ''}
        </div>
      </div>
      ${metaBits.length ? `<div class="meta-line">${metaBits.join('')}</div>` : ''}
      ${latestHtml}
      <div class="timeline-dots">${renderTimelineDots(item, color)}</div>
      ${extraFields.length || fullTimeline ? `
      <button class="expand-btn" type="button">
        ดูรายละเอียด / ประวัติทั้งหมด (${item.timeline.length} รอบ)
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="extra-fields">${extraFields.join('')}</div>
      <div class="full-timeline">${fullTimeline}</div>
      ` : ''}
    </div>`;
  }

  function itemMatchesSearch(item){
    if(!searchTerm) return true;
    const hay = [item.title, item.responsible, item.action, item.note].join(' ').toLowerCase();
    return hay.includes(searchTerm);
  }

  function renderMain(){
    const main = document.getElementById('mainContent');
    const viewCfg = VIEWS[currentView];

    if(viewCfg.gid === null){
      main.innerHTML = `<div class="empty-state">ยังไม่ได้เชื่อมต่อชีท "${escapeHtml(viewCfg.label)}"<br><span style="font-size:12px">ส่งลิงก์หรือ gid ของแท็บนี้มาเพื่อเชื่อมต่อ</span></div>`;
      return;
    }
    if(!DATASETS[currentView]){
      main.innerHTML = syncAttempted
        ? `<div class="empty-state">ยังไม่สามารถโหลดข้อมูลชุดนี้ได้ในขณะนี้<br><span style="font-size:12px">กด "ซิงก์ข้อมูลล่าสุด" ด้านบนเพื่อลองใหม่อีกครั้ง</span></div>`
        : `<div class="empty-state">กำลังโหลดข้อมูล...</div>`;
      return;
    }

    const lastLabel = DATA.timeline_labels[DATA.timeline_labels.length - 1] || '-';
    let html = '';
    let anyRendered = false;
    const doneItemsForFooter = []; // collected across departments, rendered together at the very end
    // "ย้ายไปท้ายเพจ" applies only to the tracking view — in the completed-work archive
    // view every item is already done by definition, so splitting there would just
    // erase its department grouping instead of helping.
    const splitDoneToFooter = (currentView === 'tracking');

    function sortByUrgency(items){
      // เรียงตามระดับความเร่งด่วน: เกินกำหนดมากสุดขึ้นก่อน, ที่เหลือคงลำดับเดิมของชีทไว้
      return [...items].sort((a,b)=>{
        const ao = (a.overdueDays !== null && a.overdueDays > 0) ? a.overdueDays : -Infinity;
        const bo = (b.overdueDays !== null && b.overdueDays > 0) ? b.overdueDays : -Infinity;
        return bo - ao;
      });
    }

    visibleDepartments().forEach((d, i) => {
      if(activeDept !== 'all' && activeDept !== String(i)) return;
      const filtered = d.items.filter(itemMatchesSearch);
      if(filtered.length === 0) return;

      const color = DEPT_COLORS[i % DEPT_COLORS.length];
      const activeItems = splitDoneToFooter
        ? sortByUrgency(filtered.filter(it => classify(it).key !== 'done'))
        : sortByUrgency(filtered);
      const doneItems = splitDoneToFooter ? filtered.filter(it => classify(it).key === 'done') : [];
      doneItems.forEach(it => doneItemsForFooter.push({item: it, color, deptName: d.name}));

      if(activeItems.length === 0) return; // this department's remaining items are all done -> nothing to show up top
      anyRendered = true;
      const kpi = deptKPI(d);
      html += `
      <div class="dept-section">
        <div class="dept-head">
          <span class="dept-dot" style="background:${color}"></span>
          <h2>${escapeHtml(d.name.trim())}</h2>
          <span class="dept-count">${activeItems.length} เรื่อง</span>
          <div class="dept-kpi-wrap">
            <div class="progress-bar dept-kpi-bar"><div class="progress-fill" style="width:${kpi}%; --dept-color:${color}"></div></div>
            <span class="dept-kpi-num">${kpi}%</span>
          </div>
        </div>
        <div class="card-grid">
          ${activeItems.map(it => renderCard(it, color, lastLabel)).join('')}
        </div>
      </div>`;
    });

    if(doneItemsForFooter.length){
      anyRendered = true;
      html += `
      <div class="dept-section done-section">
        <div class="dept-head">
          <span class="dept-dot" style="background:var(--teal)"></span>
          <h2>✅ เสร็จสมบูรณ์แล้ว</h2>
          <span class="dept-count">${doneItemsForFooter.length} เรื่อง</span>
        </div>
        <div class="card-grid">
          ${doneItemsForFooter.map(({item,color,deptName}) => renderCard(item, color, lastLabel, {showDeptTag:true, deptName})).join('')}
        </div>
      </div>`;
    }

    if(!anyRendered){
      html = `<div class="empty-state">ไม่พบรายการที่ตรงกับคำค้นหาในมุมมองนี้</div>`;
    }

    main.innerHTML = html;
    main.querySelectorAll('.expand-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        btn.closest('.task-card').classList.toggle('expanded');
      });
    });
  }

  // ---------- Impact footer: cumulative time/paper saved ----------
  // ผู้ใช้ระบุอัตราเอง: 85 นาที และ 390 แผ่นกระดาษ ต่อการประชุม 1 ครั้ง — คูณด้วยจำนวนรอบ
  // การประชุมที่ตรวจพบจริงในชีท (DATA.timeline_labels.length) จึงอัปเดตอัตโนมัติทุกครั้งที่
  // มีคอลัมน์รอบประชุมใหม่เพิ่มเข้ามา โดยไม่ต้องแก้ตัวเลขเอง
  const MINUTES_PER_MEETING = 85;
  const PAPER_SHEETS_PER_MEETING = 390;

  function renderImpactFooter(){
    const rounds = DATA.timeline_labels.length;
    const totalMinutes = rounds * MINUTES_PER_MEETING;
    const totalHours = (totalMinutes / 60).toFixed(1);
    const totalPaper = rounds * PAPER_SHEETS_PER_MEETING;

    document.getElementById('impactKpis').innerHTML = `
      <div class="impact-card">
        <div><span class="num">${totalMinutes.toLocaleString('th-TH')}</span><span class="unit">นาที (~${totalHours} ชม.)</span></div>
        <div class="label">เวลาทำรายงานสะสมที่ลดลง</div>
        <div class="formula">${MINUTES_PER_MEETING} นาที/ครั้ง × ${rounds} ครั้งประชุม</div>
      </div>
      <div class="impact-card">
        <div><span class="num">${totalPaper.toLocaleString('th-TH')}</span><span class="unit">แผ่น</span></div>
        <div class="label">การใช้กระดาษสะสมที่ลดลง</div>
        <div class="formula">${PAPER_SHEETS_PER_MEETING} แผ่น/ครั้ง × ${rounds} ครั้งประชุม</div>
      </div>
    `;
  }

  function renderAll(){
    renderYearSwitch();
    renderHeader();
    renderOverview();
    renderPills();
    renderMain();
    renderImpactFooter();
  }

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value.trim().toLowerCase();
    renderMain();
  });

  // ---------- Connection status ----------
  function setConn(state, text){
    const line = document.getElementById('connLine');
    const dot = line.querySelector('.conn-dot');
    dot.className = 'conn-dot' + (state ? ' ' + state : '');
    line.querySelector('span:last-child').textContent = text;
  }

  // ---------- Live sync (fetches every configured view together) ----------
  async function syncLive(manual){
    const btn = document.getElementById('syncBtn');
    btn.disabled = true;
    btn.classList.add('spinning');
    setConn('loading', 'กำลังซิงก์ข้อมูล...');

    const activeViews = Object.values(VIEWS).filter(v => v.gid !== null);
    let anySuccess = false;
    let lastErr = null;

    await Promise.all(activeViews.map(async v => {
      try{
        const url = `https://docs.google.com/spreadsheets/d/${v.id}/gviz/tq?tqx=out:csv&gid=${v.gid}`;
        const res = await fetch(url, {cache:'no-store'});
        if(!res.ok) throw new Error(`${v.label}: HTTP ${res.status}`);
        const csvText = await res.text();
        const rows = parseCSV(csvText);
        const fresh = buildDataFromRows(rows, {defaultStatus: v.defaultStatus});
        if(!fresh.departments.length) throw new Error(`${v.label}: ไม่พบข้อมูลรายการในชีท`);
        DATASETS[v.key] = fresh;
        anySuccess = true;
      } catch(err){
        console.error(`[dashboard] sync failed for ${v.key}:`, err);
        lastErr = err;
      }
    }));

    if(anySuccess){
      lastSyncedAt = new Date().toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'});
      setConn('ok', 'เชื่อมต่อ Google Sheets สำเร็จ · ' + lastSyncedAt);
    } else if(lastErr){
      const isFileProtocol = (typeof window !== 'undefined' && window.location && window.location.protocol === 'file:');
      const hint = isFileProtocol
        ? 'ไม่สามารถซิงก์ได้ — กำลังเปิดไฟล์นี้โดยตรง (file://) เบราว์เซอร์มักปิดกั้นการเชื่อมต่อแบบนี้ ลองอัปโหลดขึ้น GitHub Pages หรือรันผ่านเซิร์ฟเวอร์ในเครื่องก่อน'
        : 'ไม่สามารถซิงก์ข้อมูลสดได้ในขณะนี้ — แสดงข้อมูลชุดล่าสุดที่มีอยู่';
      setConn('err', hint);
      if(isFileProtocol) console.warn('[dashboard] Detected file:// origin — cross-origin fetch to Google Sheets is commonly blocked here. Serve the file over http(s) instead (e.g. GitHub Pages or a local dev server).');
    }

    setActiveData();
    syncAttempted = true;
    renderAll();
    btn.disabled = false;
    btn.classList.remove('spinning');
  }

  document.getElementById('syncBtn').addEventListener('click', ()=>syncLive(true));

  // ---------- Init ----------
  renderViewSwitch();
  renderAll();
  syncLive(false); // silent auto-sync on load; falls back to embedded snapshot on failure
})();

</script>
</body>
</html>
