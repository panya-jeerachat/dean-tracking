<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ดติดตามงาน — คณะวิศวกรรมศาสตร์ มมส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182338;
    --ink-soft:#3B4560;
    --slate:#6B7284;
    --paper:#F4F3EE;
    --card:#FFFFFF;
    --line:#E4E1D6;
    --line-soft:#EDEBE1;
    --teal:#2E7A63;
    --teal-bg:#E7F2ED;
    --amber:#B4832A;
    --amber-bg:#FBF1DE;
    --burgundy:#93334A;
    --burgundy-bg:#F7E9EC;
    --navy-tag:#1F3A5F;
    --dept-a:#1F3A5F;
    --dept-b:#2E7A63;
    --dept-c:#93334A;
    --dept-d:#B4832A;
    --radius:14px;
    --shadow:0 1px 2px rgba(24,35,56,0.04), 0 6px 20px -8px rgba(24,35,56,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  ::selection{background:#CFE3DA;}
  a{color:inherit;}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--slate);
  }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:rgba(244,243,238,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:1180px; margin:0 auto;
    padding:22px 24px 16px;
  }
  .top-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  h1{
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:26px;
    margin:6px 0 4px;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:560px;
  }
  .meta-box{
    text-align:left;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--slate);
    border-left:2px solid var(--line);
    padding-left:12px;
    min-width:190px;
  }
  .meta-box div{margin-bottom:3px;}
  .meta-box b{color:var(--ink-soft); font-weight:600;}

  .controls{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    margin-top:18px;
  }
  .search-wrap{
    position:relative; flex:1; min-width:220px; max-width:340px;
  }
  .search-wrap input{
    width:100%;
    font-family:'Sarabun',sans-serif;
    font-size:14px;
    padding:9px 12px 9px 32px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--dept-a);}
  .search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.45;}

  .pill-row{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{
    font-family:'Sarabun',sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .pill:hover{border-color:#C9C5B5;}
  .pill.active{
    background:var(--ink); color:#fff; border-color:var(--ink);
  }
  .pill .count{opacity:.65; font-family:'JetBrains Mono',monospace; font-size:11px; margin-left:5px;}

  /* ---------- Overview KPIs ---------- */
  .overview{
    max-width:1180px; margin:22px auto 0; padding:0 24px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
  }
  .kpi{
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .kpi .num{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:30px; color:var(--ink);
    line-height:1;
  }
  .kpi .label{margin-top:8px; font-size:12.5px; color:var(--slate);}
  .kpi.accent-teal .num{color:var(--teal);}
  .kpi.accent-amber .num{color:var(--amber);}

  /* ---------- Main ---------- */
  main{max-width:1180px; margin:0 auto; padding:28px 24px 80px;}

  .dept-section{margin-top:36px;}
  .dept-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:14px;
    padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .dept-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-bottom:2px;}
  .dept-head h2{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:17px; margin:0;
    color:var(--ink);
  }
  .dept-head .dept-count{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--slate);
  }

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;
  }

  .task-card{
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:16px 17px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px;
    border-left:3px solid var(--dept-color, var(--ink));
  }
  .task-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .task-no{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--slate);
  }
  .task-title{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:15px; color:var(--ink);
    margin:2px 0 0; line-height:1.35;
  }
  .status-tag{
    flex-shrink:0;
    font-family:'Sarabun',sans-serif; font-size:11.5px; font-weight:600;
    padding:4px 9px; border-radius:999px; white-space:nowrap;
  }
  .status-done{background:var(--teal-bg); color:var(--teal);}
  .status-near{background:var(--teal-bg); color:var(--teal);}
  .status-progress{background:var(--amber-bg); color:var(--amber);}
  .status-track{background:var(--amber-bg); color:var(--amber);}
  .status-none{background:#EEECE3; color:var(--slate);}

  .meta-line{
    font-size:12.5px; color:var(--slate); display:flex; flex-wrap:wrap; gap:4px 14px;
  }
  .meta-line span b{color:var(--ink-soft); font-weight:600;}

  .latest-block{
    background:var(--line-soft); border-radius:10px; padding:10px 12px;
  }
  .latest-block .latest-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--slate);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; display:block;
  }
  .latest-block .latest-text{font-size:13.5px; color:var(--ink-soft); white-space:pre-line;}
  .stale-flag{
    display:inline-block; margin-top:6px; font-size:11px; color:var(--burgundy);
    font-weight:600;
  }

  .timeline-dots{display:flex; gap:4px; align-items:center; flex-wrap:wrap;}
  .dot{
    width:9px; height:9px; border-radius:50%; background:#DEDBCE; cursor:default; position:relative;
  }
  .dot.filled{background:var(--dept-color, var(--ink));}
  .dot[data-tip]:hover::after{
    content:attr(data-tip);
    position:absolute; bottom:130%; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:11px; padding:6px 9px; border-radius:8px;
    white-space:pre-line; width:200px; line-height:1.4; z-index:20; box-shadow:var(--shadow);
    font-family:'Sarabun',sans-serif;
  }

  .expand-btn{
    align-self:flex-start;
    background:none; border:none; cursor:pointer;
    font-family:'Sarabun',sans-serif; font-size:12.5px; font-weight:600; color:var(--dept-color,var(--ink));
    padding:0; display:flex; align-items:center; gap:4px;
  }
  .expand-btn svg{transition:transform .15s;}
  .task-card.expanded .expand-btn svg{transform:rotate(180deg);}

  .full-timeline{display:none; flex-direction:column; gap:8px; margin-top:2px; border-top:1px dashed var(--line); padding-top:10px;}
  .task-card.expanded .full-timeline{display:flex;}
  .full-timeline .tl-entry{font-size:12.5px;}
  .full-timeline .tl-entry .tl-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--slate); display:block; margin-bottom:2px;
  }
  .full-timeline .tl-entry .tl-text{color:var(--ink-soft); white-space:pre-line;}
  .extra-fields{font-size:12px; color:var(--slate); border-top:1px dashed var(--line); padding-top:8px; margin-top:2px; display:none; flex-direction:column; gap:4px;}
  .task-card.expanded .extra-fields{display:flex;}
  .extra-fields b{color:var(--ink-soft);}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--slate); font-size:14px;
  }

  /* ---------- Sync + connection status ---------- */
  .sync-btn{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'Sarabun',sans-serif; font-size:13.5px; font-weight:600;
    padding:8px 14px; border-radius:10px;
    border:1px solid var(--ink); background:var(--ink); color:#fff;
    cursor:pointer; white-space:nowrap;
    transition:opacity .15s;
  }
  .sync-btn:hover{opacity:.88;}
  .sync-btn:disabled{opacity:.55; cursor:default;}
  .sync-btn svg{transition:transform .6s linear;}
  .sync-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .conn-line{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--slate);
    margin-top:6px;
  }
  .conn-dot{width:7px; height:7px; border-radius:50%; background:#C9C5B5; flex-shrink:0;}
  .conn-dot.ok{background:var(--teal);}
  .conn-dot.err{background:var(--burgundy);}
  .conn-dot.loading{background:var(--amber); animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---------- KPI / progress bars ---------- */
  .kpi.accent-navy .num{color:var(--dept-a);}
  .progress-bar{
    width:100%; height:6px; border-radius:999px; background:var(--line-soft); overflow:hidden;
  }
  .progress-fill{height:100%; border-radius:999px; background:var(--dept-color, var(--ink)); transition:width .4s ease;}
  .dept-kpi-wrap{display:flex; align-items:center; gap:8px; margin-left:auto;}
  .dept-kpi-num{
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:12.5px; color:var(--ink-soft);
    min-width:34px; text-align:right;
  }
  .dept-kpi-bar{width:90px;}

  footer{
    max-width:1180px; margin:0 auto; padding:24px 24px 50px;
    border-top:1px solid var(--line);
    font-size:12px; color:var(--slate);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (max-width:640px){
    .overview{grid-template-columns:repeat(2,1fr);}
    h1{font-size:21px;}
    .meta-box{border-left:none; padding-left:0; border-top:1px solid var(--line); padding-top:8px; width:100%;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <div>
        <div class="eyebrow">คณะวิศวกรรมศาสตร์ · มหาวิทยาลัยมหาสารคาม</div>
        <h1>แดชบอร์ดติดตามงานประชุมกำกับติดตามฯ</h1>
        <div class="subtitle">สรุปความคืบหน้างานสืบเนื่องจากการประชุมกำกับติดตามงานของคณบดี ปีงบประมาณ 2568–2569 แยกตามฝ่ายงานหลัก พร้อมสถานะล่าสุดของแต่ละเรื่อง</div>
      </div>
      <div>
        <div class="meta-box" id="metaBox"></div>
        <button class="sync-btn" id="syncBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          ซิงก์ข้อมูลล่าสุด
        </button>
        <div class="conn-line" id="connLine"><span class="conn-dot"></span><span>ยังไม่เชื่อมต่อ</span></div>
      </div>
    </div>

    <div class="controls">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="ค้นหาเรื่อง / ผู้รับผิดชอบ...">
      </div>
      <div class="pill-row" id="deptPills"></div>
    </div>
  </div>
</header>

<section class="overview" id="overview"></section>

  // หมายเหตุ: ผู้ใช้ให้ลิงก์มา 2 ลิงก์ แต่เป็น Sheet ID เดียวกันทั้งคู่ (1A9GP2bMue6FVqiWDIOXZVY0JUoV5hVPN)
  // ตอนนี้จึงเชื่อมต่อแหล่งเดียว — เมื่อได้ลิงก์ชีทที่สองจริงๆ ค่อยเพิ่มเข้าใน SOURCES ด้านล่าง
  // (โครงสร้างโค้ดรองรับหลายแหล่งพร้อมผสานข้อมูลแล้ว โดยจะรวมแผนกที่ชื่อตรงกัน และต่อรอบประชุมที่ไม่ซ้ำกัน)
  const SOURCES = [
    { id: '1A9GP2bMue6FVqiWDIOXZVY0JUoV5hVPN', gid: 0, label: 'ชีทหลัก' }
  ];

  const DEPT_COLORS = ['var(--dept-a)','var(--dept-b)','var(--dept-c)','var(--dept-d)'];

  // ---------- Status mapping ----------
  // ใช้ค่าจากคอลัมน์ "สถานะ" ที่ผู้กรอกระบุเองในชีทโดยตรง (ไม่เดาจากคำในข้อความอีกต่อไป)
  // 5 ระดับ: ยังไม่มีรายงาน 0% / ติดตามงาน 25% / กำลังดำเนินการ 50% / ใกล้เสร็จสมบูรณ์ 75% / สำเร็จ 100%
  // สถานะ "ซ้ำ" = รายการซ้ำ ไม่นำมานับในสรุปหรือแสดงในแดชบอร์ด
  const STATUS_MAP = {
    'ยังไม่มีรายงาน':   {percent: 0,   label: 'ยังไม่มีรายงาน',   key:'none'},
    'ติดตามงาน':        {percent: 25,  label: 'ติดตามงาน',        key:'track'},
    'กำลังดำเนินการ':    {percent: 50,  label: 'กำลังดำเนินการ',    key:'progress'},
    'ใกล้เสร็จสมบูรณ์':  {percent: 75,  label: 'ใกล้เสร็จสมบูรณ์',  key:'near'},
    'สำเร็จ':           {percent: 100, label: 'สำเร็จ',           key:'done'}
  };
  const EXCLUDED_STATUS = 'ซ้ำ';

  function classify(item){
    const raw = (item.status || '').trim();
    if(STATUS_MAP[raw]) return STATUS_MAP[raw];
    return {percent: 0, label: raw ? `ไม่ทราบสถานะ (${raw})` : 'ยังไม่มีรายงาน', key: raw ? 'unknown' : 'none'};
  }

  function isStale(item, lastLabel){
    if(!item.latest) return false;
    return item.latest.label !== lastLabel;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Robust CSV parser (handles quoted fields, embedded newlines/commas) ----------
  // หมายเหตุ: ตัวแยกวิเคราะห์นี้ถือว่าเครื่องหมาย " เป็นตัวเริ่ม/ปิดฟิลด์ก็ต่อเมื่ออยู่ที่ตำแหน่ง
  // เริ่มต้นของฟิลด์เท่านั้น (มาตรฐาน RFC4180) — ถ้าพบ " กลางข้อความ (เช่น เครื่องหมายนิ้ว
  // หรือคำพูดที่พิมพ์ในข้อความประชุม) จะถือเป็นตัวอักษรธรรมดา ไม่ใช่ตัวเปิดฟิลด์ใหม่
  // ป้องกันปัญหาข้อมูลหลายแถวถูกกลืนรวมเป็นแถวเดียวเมื่อเจอเครื่องหมาย " ที่ไม่ได้ตั้งใจ
  function parseCSV(text){
    text = text.replace(/^\uFEFF/, ''); // strip UTF-8 BOM that Google's CSV export often prepends
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    for(let i=0; i<text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else{ inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if(c === '"' && field === ''){ inQuotes = true; } // only a true field-start quote toggles quote mode
        else if(c === ','){ row.push(field); field = ''; }
        else if(c === '\r'){ /* skip */ }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function normCell(s){
    return (s||'').replace(/\u00A0/g,' ').replace(/\uFEFF/g,'').trim();
  }

  // ---------- Build dashboard data from raw CSV rows, detecting columns by header text ----------
  function buildDataFromRows(rows){
    // find header row: primarily key off 'เรื่อง' (title column), confirmed by a nearby
    // supporting column header — more robust than requiring 'ที่' as an exact standalone
    // cell, since merged/grouped columns can occasionally shift its exact text.
    let headerRowIdx = -1;
    const scanLimit = Math.min(rows.length, 30);
    const supportHeaders = ['การดำเนินการ','กำหนดเวลา','ผู้รับผิดชอบหลัก','หมายเหตุ','สถานะ'];
    for(let i=0; i<scanLimit; i++){
      const cells = rows[i].map(normCell);
      const hasTitle = cells.includes('เรื่อง');
      const hasSupport = cells.some(c => supportHeaders.includes(c));
      if(hasTitle && hasSupport){ headerRowIdx = i; break; }
    }
    if(headerRowIdx === -1){
      const preview = rows.slice(0, 4).map(r => r.slice(0,5).map(normCell).join(' | ')).join(' // ');
      console.error('[dashboard] header row not found. First rows preview:', preview);
      throw new Error('ไม่พบแถวหัวตาราง');
    }

    const header = rows[headerRowIdx].map(c => normCell(c).replace(/^"+|"+$/g,'').replace(/\s+/g,' '));
    let noCol=-1, titleCol=-1, actionCol=-1, deadlineCol=-1, respCol=-1, noteCol=-1, statusCol=-1, kpiCol=-1;
    const timelineCols = [];

    header.forEach((h, idx) => {
      if(!h) return;
      if(h === 'ที่' && noCol === -1){ noCol = idx; return; }
      if(h === 'เรื่อง' && titleCol === -1){ titleCol = idx; return; }
      if(h === 'การดำเนินการ' && actionCol === -1){ actionCol = idx; return; }
      if(h === 'กำหนดเวลา' && deadlineCol === -1){ deadlineCol = idx; return; }
      if(h.includes('ผู้รับผิดชอบ') && respCol === -1){ respCol = idx; return; }
      if(h === 'หมายเหตุ' && noteCol === -1){ noteCol = idx; return; }
      if(h === 'สถานะ' && statusCol === -1){ statusCol = idx; return; }
      if(h.includes('ความคืบหน้า') && h.includes('KPI') && kpiCol === -1){ kpiCol = idx; return; }
      // everything else with header text -> treated as a timeline/meeting column
      timelineCols.push({index: idx, label: h});
    });

    const departments = [];
    let current = null;
    let itemId = 0;
    const width = header.length;

    for(let i = headerRowIdx + 1; i < rows.length; i++){
      const r = rows[i];
      const cells = [];
      for(let j=0; j<width; j++){ cells.push(normCell(r[j])); }
      const nonEmptyIdx = cells.map((c,idx)=>c?idx:-1).filter(idx=>idx!==-1);

      if(nonEmptyIdx.length === 1 && cells[nonEmptyIdx[0]].includes('ฝ่าย') && cells[nonEmptyIdx[0]].startsWith('งาน')){
        current = {name: cells[nonEmptyIdx[0]], items: []};
        departments.push(current);
        continue;
      }

      const title = titleCol!==-1 ? cells[titleCol] : '';
      const no = noCol!==-1 ? cells[noCol] : '';
      if(!title && !no) continue; // blank spacer row
      if(!title) continue; // no title -> nothing meaningful to show

      const statusRaw = statusCol!==-1 ? cells[statusCol] : '';
      if(statusRaw.trim() === EXCLUDED_STATUS) continue; // รายการซ้ำ -> ไม่นับ ไม่แสดง

      if(!current){ current = {name:'อื่นๆ', items:[]}; departments.push(current); }

      const timeline = timelineCols
        .map(tc => ({label: tc.label, text: cells[tc.index]}))
        .filter(t => t.text);

      itemId++;
      current.items.push({
        id: itemId,
        no: no,
        title: title,
        action: actionCol!==-1 ? cells[actionCol] : '',
        deadline: deadlineCol!==-1 ? cells[deadlineCol] : '',
        responsible: respCol!==-1 ? cells[respCol] : '',
        note: noteCol!==-1 ? cells[noteCol] : '',
        status: statusRaw,
        kpi: kpiCol!==-1 ? cells[kpiCol] : '',
        timeline: timeline,
        latest: timeline.length ? timeline[timeline.length-1] : null
      });
    }

    const timelineLabels = timelineCols.map(tc=>tc.label);
    return {timeline_labels: timelineLabels, departments: departments.filter(d=>d.items.length)};
  }

  // ---------- Merge multiple sources ----------
  function mergeDatasets(list){
    if(list.length === 1) return list[0];
    const merged = {timeline_labels: [], departments: []};
    const deptIndex = {};
    list.forEach(ds => {
      ds.timeline_labels.forEach(lbl => { if(!merged.timeline_labels.includes(lbl)) merged.timeline_labels.push(lbl); });
      ds.departments.forEach(d => {
        const key = d.name.trim();
        if(deptIndex[key] === undefined){
          deptIndex[key] = merged.departments.length;
          merged.departments.push({name: d.name, items: [...d.items]});
        } else {
          merged.departments[deptIndex[key]].items.push(...d.items);
        }
      });
    });
    return merged;
  }


  // ---------- State ----------
  let DATA = JSON.parse(document.getElementById('dashboard-data').textContent);
  let activeDept = 'all';
  let searchTerm = '';
  let lastSyncedAt = null;

  // ---------- KPI helpers ----------
  function deptKPI(dept){
    if(!dept.items.length) return 0;
    const sum = dept.items.reduce((a,it)=>a + classify(it).percent, 0);
    return Math.round(sum / dept.items.length);
  }
  function overallKPI(){
    const all = DATA.departments.flatMap(d=>d.items);
    if(!all.length) return 0;
    const sum = all.reduce((a,it)=>a + classify(it).percent, 0);
    return Math.round(sum / all.length);
  }

  function shortName(name){
    return name.trim().replace(/^งาน\s*/, '').replace(/\s+/g,' ');
  }

  // ---------- Rendering ----------
  function renderHeader(){
    const lastLabel = DATA.timeline_labels[DATA.timeline_labels.length - 1] || '-';
    document.getElementById('metaBox').innerHTML = `
      <div><b>รอบข้อมูลล่าสุด:</b> ${escapeHtml(lastLabel)}</div>
      <div><b>รอบการติดตามทั้งหมด:</b> ${DATA.timeline_labels.length} ครั้ง</div>
      <div><b>จำนวนฝ่ายงาน:</b> ${DATA.departments.length} ฝ่าย</div>
      ${lastSyncedAt ? `<div><b>ซิงก์ล่าสุด:</b> ${escapeHtml(lastSyncedAt)}</div>` : ''}
    `;
  }

  function renderOverview(){
    const lastLabel = DATA.timeline_labels[DATA.timeline_labels.length - 1] || '-';
    const totalItems = DATA.departments.reduce((a,d)=>a+d.items.length,0);
    const updatedLatest = DATA.departments.reduce((a,d)=>a + d.items.filter(it=>it.latest && it.latest.label===lastLabel).length, 0);
    const noReport = DATA.departments.reduce((a,d)=>a + d.items.filter(it=>!it.latest).length, 0);
    const kpi = overallKPI();

    document.getElementById('overview').innerHTML = `
      <div class="kpi">
        <div class="num">${totalItems}</div>
        <div class="label">เรื่องที่ติดตามทั้งหมด</div>
      </div>
      <div class="kpi accent-navy">
        <div class="num">${kpi}%</div>
        <div class="label">ความคืบหน้าเฉลี่ยรวม (ประมาณการจากสถานะ)</div>
      </div>
      <div class="kpi accent-teal">
        <div class="num">${updatedLatest}</div>
        <div class="label">อัปเดตในการประชุมล่าสุด (${escapeHtml(lastLabel)})</div>
      </div>
      <div class="kpi accent-amber">
        <div class="num">${noReport}</div>
        <div class="label">ยังไม่เคยมีรายงานความคืบหน้า</div>
      </div>
    `;
  }

  function renderPills(){
    const totalItems = DATA.departments.reduce((a,d)=>a+d.items.length,0);
    const pillRow = document.getElementById('deptPills');
    let html = `<button class="pill ${activeDept==='all'?'active':''}" data-dept="all">ทั้งหมด <span class="count">${totalItems}</span></button>`;
    DATA.departments.forEach((d,i) => {
      html += `<button class="pill ${activeDept===String(i)?'active':''}" data-dept="${i}">${escapeHtml(shortName(d.name))} <span class="count">${d.items.length}</span></button>`;
    });
    pillRow.innerHTML = html;
    pillRow.querySelectorAll('.pill').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeDept = btn.dataset.dept; renderMain(); renderPills(); });
    });
  }

  function renderTimelineDots(item, color){
    return DATA.timeline_labels.map(lbl=>{
      const entry = item.timeline.find(t=>t.label===lbl);
      const cls = entry ? 'dot filled' : 'dot';
      const tip = entry ? `${lbl}\n${entry.text}` : lbl;
      return `<span class="${cls}" style="--dept-color:${color}" data-tip="${escapeHtml(tip)}"></span>`;
    }).join('');
  }

  function renderCard(item, color, lastLabel){
    const status = classify(item);
    const stale = isStale(item, lastLabel);
    const statusClassMap = {
      done: 'status-done', near: 'status-near', progress: 'status-progress',
      track: 'status-track', none: 'status-none', unknown: 'status-none'
    };
    const statusClass = statusClassMap[status.key] || 'status-none';

    const metaBits = [];
    if(item.responsible) metaBits.push(`<span><b>ผู้รับผิดชอบ</b> ${escapeHtml(item.responsible)}</span>`);
    if(item.deadline) metaBits.push(`<span><b>กำหนดเวลา</b> ${escapeHtml(item.deadline)}</span>`);

    const latestHtml = item.latest
      ? `<div class="latest-block"><span class="latest-label">${escapeHtml(item.latest.label)}</span><div class="latest-text">${escapeHtml(item.latest.text)}</div>${stale ? `<div class="stale-flag">● ยังไม่อัปเดตในการประชุมล่าสุด</div>` : ''}</div>`
      : `<div class="latest-block"><span class="latest-label">สถานะ</span><div class="latest-text">ยังไม่มีการรายงานความคืบหน้าในรอบการประชุมใดๆ</div></div>`;

    const fullTimeline = item.timeline.length
      ? item.timeline.map(t=>`<div class="tl-entry"><span class="tl-label">${escapeHtml(t.label)}</span><span class="tl-text">${escapeHtml(t.text)}</span></div>`).join('')
      : '';

    const extraFields = [];
    if(item.action) extraFields.push(`<div><b>การดำเนินการ:</b> ${escapeHtml(item.action)}</div>`);
    if(item.note) extraFields.push(`<div><b>หมายเหตุ:</b> ${escapeHtml(item.note)}</div>`);
    if(item.kpi) extraFields.push(`<div><b>ความคืบหน้า KPI (ตามที่ระบุในชีท):</b> ${escapeHtml(item.kpi)}</div>`);

    return `
    <div class="task-card" style="--dept-color:${color}">
      <div class="task-top">
        <div>
          <div class="task-no">${item.no ? '#'+escapeHtml(item.no) : ''}</div>
          <div class="task-title">${escapeHtml(item.title)}</div>
        </div>
        <div class="status-tag ${statusClass}">${status.label} · ${status.percent}%</div>
      </div>
      ${metaBits.length ? `<div class="meta-line">${metaBits.join('')}</div>` : ''}
      ${latestHtml}
      <div class="timeline-dots">${renderTimelineDots(item, color)}</div>
      ${extraFields.length || fullTimeline ? `
      <button class="expand-btn" type="button">
        ดูรายละเอียด / ประวัติทั้งหมด (${item.timeline.length} รอบ)
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="extra-fields">${extraFields.join('')}</div>
      <div class="full-timeline">${fullTimeline}</div>
      ` : ''}
    </div>`;
  }

  function itemMatchesSearch(item){
    if(!searchTerm) return true;
    const hay = [item.title, item.responsible, item.action, item.note].join(' ').toLowerCase();
    return hay.includes(searchTerm);
  }

  function renderMain(){
    const lastLabel = DATA.timeline_labels[DATA.timeline_labels.length - 1] || '-';
    const main = document.getElementById('mainContent');
    let html = '';
    let anyRendered = false;

    DATA.departments.forEach((d, i) => {
      if(activeDept !== 'all' && activeDept !== String(i)) return;
      const items = d.items.filter(itemMatchesSearch);
      if(items.length === 0) return;
      anyRendered = true;
      const color = DEPT_COLORS[i % DEPT_COLORS.length];
      const kpi = deptKPI(d);
      html += `
      <div class="dept-section">
        <div class="dept-head">
          <span class="dept-dot" style="background:${color}"></span>
          <h2>${escapeHtml(d.name.trim())}</h2>
          <span class="dept-count">${items.length} เรื่อง</span>
          <div class="dept-kpi-wrap">
            <div class="progress-bar dept-kpi-bar"><div class="progress-fill" style="width:${kpi}%; --dept-color:${color}"></div></div>
            <span class="dept-kpi-num">${kpi}%</span>
          </div>
        </div>
        <div class="card-grid">
          ${items.map(it => renderCard(it, color, lastLabel)).join('')}
        </div>
      </div>`;
    });

    if(!anyRendered){
      html = `<div class="empty-state">ไม่พบรายการที่ตรงกับคำค้นหา</div>`;
    }

    main.innerHTML = html;
    main.querySelectorAll('.expand-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        btn.closest('.task-card').classList.toggle('expanded');
      });
    });
  }

  function renderAll(){
    renderHeader();
    renderOverview();
    renderPills();
    renderMain();
  }

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value.trim().toLowerCase();
    renderMain();
  });

  // ---------- Connection status ----------
  function setConn(state, text){
    const line = document.getElementById('connLine');
    const dot = line.querySelector('.conn-dot');
    dot.className = 'conn-dot' + (state ? ' ' + state : '');
    line.querySelector('span:last-child').textContent = text;
  }

  // ---------- Live sync ----------
  async function syncLive(manual){
    const btn = document.getElementById('syncBtn');
    btn.disabled = true;
    btn.classList.add('spinning');
    setConn('loading', 'กำลังซิงก์ข้อมูล...');
    try{
      const results = await Promise.all(SOURCES.map(async src => {
        const url = `https://docs.google.com/spreadsheets/d/${src.id}/gviz/tq?tqx=out:csv&gid=${src.gid}`;
        const res = await fetch(url, {cache:'no-store'});
        if(!res.ok) throw new Error(`${src.label}: HTTP ${res.status}`);
        const csvText = await res.text();
        const rows = parseCSV(csvText);
        try{
          return buildDataFromRows(rows);
        } catch(parseErr){
          throw new Error(`${src.label}: ${parseErr.message}`);
        }
      }));
      const fresh = mergeDatasets(results);
      if(!fresh.departments.length) throw new Error('ไม่พบข้อมูลรายการในชีท');
      DATA = fresh;
      lastSyncedAt = new Date().toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'});
      setConn('ok', 'เชื่อมต่อ Google Sheets สำเร็จ · ' + lastSyncedAt);
      renderAll();
    } catch(err){
      console.error('[dashboard] sync failed:', err);
      setConn('err', 'ไม่สามารถซิงก์ข้อมูลสดได้ในขณะนี้ — แสดงข้อมูลชุดล่าสุดที่มีอยู่');
    } finally {
      btn.disabled = false;
      btn.classList.remove('spinning');
    }
  }

  document.getElementById('syncBtn').addEventListener('click', ()=>syncLive(true));

  // ---------- Init ----------
  renderAll();
  syncLive(false); // silent auto-sync on load; falls back to embedded snapshot on failure
})();

</script>
</body>
</html>
